[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hyper-vyper"
version = "0.1.0"
description = "Vyper library for HyperEVM: HyperCore precompile reads, CoreWriter actions, unit conversions and bridging between HyperEVM and HyperCore"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CrowdCent" }]
keywords = ["vyper", "hyperliquid", "hyperevm", "hypercore", "corewriter", "precompiles", "smart-contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Other",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
# Every module has `# pragma version 0.4.3`, and the library is tested only on 0.4.3.
dependencies = [
    "vyper==0.4.3",
]

[project.optional-dependencies]
# Only hyper_vyper.testing (the CoreSim HyperCore simulator) needs these.
testing = [
    # The simulator uses titanoboa internals (raw precompiles, env.evm.patch).
    "titanoboa==0.2.8",
    "eth-abi>=5.2.0,<7",
]

[project.urls]
Homepage = "https://github.com/crowdcent/hyper-vyper"
Documentation = "https://crowdcent.github.io/hyper-vyper/"
Source = "https://github.com/crowdcent/hyper-vyper"
Issues = "https://github.com/crowdcent/hyper-vyper/issues"
Changelog = "https://github.com/crowdcent/hyper-vyper/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    # The same pins as the `testing` extra. A "hyper-vyper[testing]" entry here does
    # not install them, because of the docs conflict below.
    "titanoboa==0.2.8",
    "eth-abi>=5.2.0,<7",
    "pytest>=8.0",
    "eth-account>=0.13",
    "eth-utils>=5",
    "hypothesis>=6.151.12",
    "ruff>=0.14.0",
    "hyperliquid-python-sdk==0.24.0",
]
docs = ["zensical==0.0.70"]

[project.scripts]
hyper-vyper-check-source = "hyper_vyper.check_source:main"

[tool.hatch.build.targets.wheel]
# The wheel holds only the hyper_vyper package: the five .vy modules, the source
# checker, and the Python testing helpers with their data. Vyper finds the
# modules on sys.path.
packages = ["src/hyper_vyper"]

[tool.hatch.build.targets.sdist]
# The sdist only rebuilds the wheel. The repository tests need docs/, examples/
# and tutorials/, so they stay in the source repository.
only-include = ["src/hyper_vyper", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.uv]
# Titanoboa pins an older MkDocs stack. Build docs separately from contract tests.
conflicts = [
    [{ group = "dev" }, { group = "docs" }],
    [{ extra = "testing" }, { group = "docs" }],
]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-m 'not fork and not packaging'"
markers = [
    "fork: tests that fork live HyperEVM mainnet (require network; run with -m fork)",
    "packaging: build the wheel and install it in a fresh uv project (slow; run with -m packaging)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
