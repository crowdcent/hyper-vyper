name: Set up uv and Python
description: Install the pinned uv and Python versions. Run actions/checkout first.
inputs:
  python-version:
    description: The Python version.
    default: "3.12.7"
  enable-cache:
    description: Cache uv downloads between runs.
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        version: "0.7.13"
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
