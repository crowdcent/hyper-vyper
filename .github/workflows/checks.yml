name: Checks
# The checks that every change and every release must pass. Library checks and
# Release call this workflow.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked
      - run: uv run --locked hyper-vyper-check-source src examples tutorials
      - run: uv run --locked ruff check scripts tests tutorials src examples
      - run: uv run --locked ruff format --check scripts tests tutorials src examples
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"
      - run: npm ci --prefix tests/reference --ignore-scripts --no-audit --no-fund
      - run: uv run --locked scripts/solidity_reference.py --check

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12.7", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest

  # Build the wheel, install it in a new uv project and use it there: compile
  # with the vyper command and titanoboa, and run the testing quick start.
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked
      - run: uv run --locked pytest -m packaging

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - run: uv run --locked --only-group docs zensical build --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hyper-vyper-docs
          path: site/
          if-no-files-found: error
          retention-days: 14
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
