name: Library checks
on:
  push:
    branches: [main] # other branches run through their pull request
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly fork tests against live HyperEVM

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs, but never a run on main, which can deploy the docs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/checks.yml

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Read-only tests against the live HyperEVM RPC. Public RPCs can be slow or
  # rate-limited, and chain data can change, so a failure does not fail the run.
  fork:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - run: uv sync --locked
      - run: uv run --locked pytest -m fork
